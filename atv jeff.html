<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Atividade</title>
	<style>

		table {
			border-collapse: collapse;
			margin-top: 10px;
			
		}

		th, td {
			border: 1px solid;	
		}

		td{
			padding: 0.8vh;
		}

		th {
			font-weight: bold;
			justify-content: center;
			align-items: center;
			height: 4vh;
			padding: 1vh;
		}

		body{
			background-color: #a9a9a9;
			background-image: url('fundoAzul.jpeg');
			background-repeat: no-repeat;
  			background-size: cover;
  			background-attachment: fixed; 
		}

		

		
		input {
			width: 40vh;
			height: 50px;
			border-radius: 10px;
			margin: 1vh auto;
			border-color: transparent;
			
		}
		
		h1 {
			display: flex;
			justify-content: center;
			align-items: center;
			font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
		}

		.content{
			display: flex;
			justify-content: center;
			align-items: center;
			margin-top: 10vh;
		}

		.card {
			background: rgba(255, 255, 255, 0.006);
			backdrop-filter: blur(1vh);

			height: auto;
			width: 80vh;
			border-radius: 2vh;
			border: 0.1vh solid rgb (255,255,255,0.3);
			color: rgb(255, 255, 255);
			

			
		}
		.inputs {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			
		}
		
		.botoes{
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: row;
			gap: 0.8vh;
		
		}

		.cssBotao{
			width: 13vh;
			border-radius: 0.5vh;
			border-color: transparent;
			margin: 1vh 0;
		
	}
	
	
		#remover {
			width: 40.9vh;
			height: 6vh;
			border-radius: 1vh;
			border-color: transparent;
	}
	
		#botao{
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 0.5vh;
			margin: 0.6vh auto;
			width: 40.9vh;
			height: 6vh;
			border-radius: 1vh;
			border-color: transparent;
	}

		#title {
			display: flex;
			justify-content: center;
			align-items: center;
			margin: 3vh 0; 
	}

		#TEXT {
			display: flex;
			justify-content: center;
			align-items: center;
	}

		#areaResumo {
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
	}

		#areaTabela {

			display: flex;
			justify-content: center;
			align-items: center;
			margin: 0 0 1vh;
	}

	

		

		

	</style>
</head>
<body>
	<div class="content">
		
		<div class="card">

		<h1>Cadastro de Produtos</h1>

			<div class="inputs">
	
			
		<input id="NOME" type="text" placeholder="Digite o nome do Produto">

		<input id="PRECO" type="number" placeholder="Digite o preço do Produto" min="0">

		 <input id="QTD" type="number" placeholder="Digite a quantidade de produtos" min="0">

			</div>

		<button id="botao" onclick="adicionar()">Adicionar produto</button>
		
		<div class="botoes">

		<button class="cssBotao" onclick="mostrar()">Listar produtos</button>
		<button class="cssBotao" onclick="resumo()">Resumo</button>
		<button class="cssBotao" onclick="limparTudo()">Limpar tudo</button>
	</div>

		
	<div class="inputs">

		<input id="removeInd" type="number" placeholder="Limpar por Índice" min="0">

		<button id="remover" onclick="removerPorindice()">Remover</butto>	

	</div>
	<h3 id="title"></h3>

	<p id="TEXT"></p>

	<div id="areaResumo"></div>

	<div id= areaTabela></div>

		</div>
	</div>
	<script>

		let listaArray = [];
		let title = document.getElementById('title')
	

		function adicionar() {
			let NOME = document.getElementById("NOME").value
			let PRECO = document.getElementById("PRECO").value
			let QTD = document.getElementById("QTD").value

			TEXT.innerText =""
			title.innerText = "Produtos adicionados"


			let areaRes = document.getElementById("areaResumo");
			areaRes.innerHTML = "";

			if (!NOME || !PRECO || !QTD){
				alert ("preencha todos os campos!")

			} else{

			let produto = {
			nome: NOME,
			preco: PRECO,
			qtd: QTD
		};

			listaArray.push(produto);

			let lista = document.getElementById("LISTA");

			

			document.getElementById("NOME").value = "";
			document.getElementById("PRECO").value = "";
			document.getElementById("QTD").value = "";

			let TEXT = document.getElementById("TEXT")

			TEXT.innerText = `Produto adicionado. Total: ${listaArray.length}`

			document.getElementById("areaTabela").innerHTML = ""

			
		}}

		function mostrar() {

			let areaRes = document.getElementById("areaResumo");
			areaRes.innerHTML = "";


			TEXT.innerText =""
			title.innerText = "Tabela de Produtos"


			let area = document.getElementById("areaTabela");
			area.innerHTML = "";

			let tabela = document.createElement("table");
			tabela.border = "1";

			let cabecalho = document.createElement("tr");

			cabecalho.innerHTML = `

					<th>Índice</th>
					<th>Nome</th>
					<th>Preço</th>
					<th>Quantidade</th>
					<th>Subtotal</th>
					
					`;

			tabela.appendChild(cabecalho);
			
			for (let i = 0; i < listaArray.length; i++){
				
				let linha = document.createElement("tr");

				let precoTable = parseFloat(listaArray[i].preco).toFixed(2);

				let subtotal = listaArray[i].preco * listaArray[i].qtd;

				subtotal = subtotal.toFixed(2)

				
				linha.innerHTML = `

					<td>${i}</td>
					<td>${listaArray[i].nome}</td>
					<td>${precoTable}</td>	
					<td>${listaArray[i].qtd}</td>		
					<td>${subtotal}</td>		

				`;

				tabela.appendChild(linha);

				area.appendChild(tabela);
				
			};
		};

		function resumo () {
			let listaQtd = [];
			let SOMAqtd = 0;
			document.getElementById("areaTabela").innerHTML = ""
			TEXT.innerText = ""
			
			for (let i= 0; i < listaArray.length; i++){
				
				let somaQtd = parseInt(listaArray[i].qtd);
				
				listaQtd.push(somaQtd)
			};
			
			parseInt(listaQtd)
			listaQtd.forEach(somar => {
				SOMAqtd += somar;

			});

			
			let SOMApreco = 0

			for (let i= 0; i < listaArray.length; i++){
				
				let somaPreco = parseFloat(listaArray[i].preco);
				let somaQtd = parseInt(listaArray[i].qtd);
				
			};
			
		
			for (let i= 0; i < listaArray.length; i++){
				
				let somaPreco = parseFloat(listaArray[i].preco);
				let somaQtd = parseInt(listaArray[i].qtd);
				
				SOMApreco += somaPreco * somaQtd
			};
			


			let areaRes = document.getElementById("areaResumo");
			areaRes.innerHTML = "";

			title.innerText = "Resumo"


			let ResumoTotal = document.createElement("p");
			let ResumoQtd = document.createElement("p");
			let ResumoPreco = document.createElement("p");

			ResumoTotal.innerHTML = `- Total de produtos (linhas): ${listaArray.length}`;
			ResumoQtd.innerHTML = `- Total de itens (somando quantidade): ${SOMAqtd}`;
			ResumoPreco.innerText = `Total do estoque: R$ ${SOMApreco.toFixed(2)}`

			areaRes.appendChild(ResumoTotal);
			areaRes.appendChild(ResumoQtd);
			areaRes.appendChild(ResumoPreco);
			
		}

		function limparTudo (){

			document.getElementById("areaTabela").innerHTML = ""
			document.getElementById("areaResumo").innerHTML =""

			listaArray = [];
			TEXT.innerText = "Todos os produtos foram removidos";
		};

		function removerPorindice () {

			document.getElementById("title").innerText = ""
			document.getElementById("areaTabela").innerHTML = "";
			document.getElementById("areaResumo").innerHTML ="";

		let removerIndice = document.getElementById("removeInd").value;

			if (removerIndice  >=0 &&  removerIndice <listaArray.length){
				
			listaArray.splice(removerIndice,1);

			document.getElementById("removeInd").value = "";

			TEXT.innerHTML = `indice ${removerIndice} removido com sucesso `;

			} else{

				alert("Digite um valor de indice válido");

			
		};
	};




	</script>
	
</body>
</html>
